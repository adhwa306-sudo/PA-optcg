<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PA-optcg vault</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0b0f17" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0b0f17;
      color: #f9fafb;
      padding: 16px;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      color: #111827;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      margin-bottom: 16px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      color: #111827;
    }
    .sub {
      margin: 0 0 14px;
      color: #6b7280;
      font-size: 0.88rem;
    }
    .status-pill {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #111827;
    }
    .status-pill.admin {
      background: #dcfce7;
      color: #166534;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .filter-btn {
      background: #161d2b;
      color: #e5e7eb;
      border: 1px solid #2d3748;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #ffffff;
      color: #111827;
      border-color: #ffffff;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .full {
      grid-column: 1 / -1;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #374151;
    }
    .hint {
      display: block;
      font-size: 0.74rem;
      color: #6b7280;
      margin-top: 4px;
    }
    input, select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.92rem;
      background: #ffffff;
      color: #111827;
    }
    input[type="file"] {
      padding: 7px 9px;
      font-size: 0.84rem;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #111827;
      color: #ffffff;
      width: 100%;
      padding: 10px 14px;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .btn-admin {
      background: #111827;
      color: #ffffff;
      padding: 7px 12px;
      font-size: 0.82rem;
    }
    .btn-logout {
      background: #fee2e2;
      color: #991b1b;
      padding: 7px 12px;
      font-size: 0.82rem;
    }
    .grid-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .item-card {
      background: #ffffff;
      color: #111827;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      border-top: 4px solid #16a34a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .item-card.sold-out {
      border-top-color: #dc2626;
    }
    .product-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-bottom: 10px;
      display: block;
      background: #f9fafb;
    }
    .img-placeholder {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      border: 1px dashed #d1d5db;
      background: #f9fafb;
      color: #9ca3af;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      text-align: center;
      padding: 8px;
    }
    .badge-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .cat-badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      background: #ede9fe;
      color: #5b21b6;
    }
    .cat-badge.ready {
      background: #e0f2fe;
      color: #075985;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      background: #dcfce7;
      color: #166534;
    }
    .sold-out .badge {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge-new {
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      background: #fef3c7;
      color: #92400e;
    }
    .item-title {
      font-weight: 700;
      font-size: 0.98rem;
      line-height: 1.3;
      margin-bottom: 4px;
      color: #111827;
    }
    .item-price {
      font-weight: 800;
      font-size: 0.95rem;
      color: #111827;
      margin-bottom: 4px;
    }
    .item-note {
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: #f9fafb;
      color: #111827;
      padding: 8px 6px;
      border-radius: 8px;
      margin: 6px 0 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 0.9rem;
      font-weight: 700;
    }
    .stat-label {
      font-size: 0.68rem;
      color: #6b7280;
    }
    .btn-order {
      display: block;
      text-decoration: none;
      background: #16a34a;
      color: #ffffff;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
    }
    .btn-order.disabled {
      background: #e5e7eb;
      color: #6b7280;
      pointer-events: none;
    }
    .buyers-box {
      background: #f9fafb;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 10px;
    }
    .buyers-title {
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1f2937;
    }
    .buyer-list {
      margin: 0;
      padding-left: 16px;
      font-size: 0.8rem;
    }
    .buyer-list li {
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .btn-mini-del {
      background: #fee2e2;
      color: #991b1b;
      padding: 2px 6px;
      font-size: 0.7rem;
      border-radius: 5px;
    }
    .buyer-form {
      display: grid;
      grid-template-columns: 1fr 62px auto;
      gap: 5px;
      margin-top: 8px;
    }
    .buyer-form input {
      padding: 6px 8px;
      font-size: 0.8rem;
    }
    .actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .btn-slot { background: #e5e7eb; color: #111827; }
    .btn-copy { background: #dbeafe; color: #1e40af; }
    .btn-del { background: #fee2e2; color: #991b1b; }
    .msg-error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    @media (max-width: 820px) {
      .grid-list { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      body { padding: 10px; }
      .grid-list { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .item-card { padding: 9px; }
      .form-grid { grid-template-columns: 1fr; }
      .buyer-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top-bar">
        <h1>Pre-Order & Ready Stock TCG</h1>
        <div style="display:flex; gap:8px; align-items:center;">
          <span id="roleBadge" class="status-pill">Mod Lihat Sahaja</span>
          <button type="button" id="adminBtn" class="btn-admin" onclick="toggleAdmin()">Mod Admin</button>
        </div>
      </div>
      <p class="sub" id="roleDesc">Pilih kategori Pre-Order atau Ready Stock, semak gambar, harga, baki slot, dan terus order ke WhatsApp.</p>

      <div id="adminFormWrap" style="display:none;">
        <form id="preorderForm" class="form-grid">
          <div>
            <label for="itemCategory">Kategori</label>
            <select id="itemCategory" required>
              <option value="Pre-Order">Pre-Order</option>
              <option value="Ready Stock">Ready Stock</option>
            </select>
          </div>
          <div>
            <label for="itemName">Nama Item / Set Kad</label>
            <input id="itemName" type="text" placeholder="Contoh: Luffy Gear 5 Promo" required />
          </div>
          <div>
            <label for="totalSlot">Jumlah Slot / Stok</label>
            <input id="totalSlot" type="number" min="1" placeholder="Contoh: 15" required />
          </div>
          <div>
            <label for="itemPrice">Harga Seunit (RM)</label>
            <input id="itemPrice" type="number" min="0" step="0.01" placeholder="Contoh: 120.00" required />
          </div>
          <div>
            <label for="slotNote">Catatan Ringkas (Pilihan)</label>
            <input id="slotNote" type="text" placeholder="Contoh: Est sampai 25/11/2026" />
          </div>
          <div>
            <label for="itemImage">Link Gambar (Pilihan)</label>
            <input id="itemImage" type="text" placeholder="https://... (jika tak upload fail)" />
          </div>
          <div class="full">
            <label for="itemImageFile">Atau Upload Gambar Dari Telefon / Komputer (Pilihan)</label>
            <input id="itemImageFile" type="file" accept="image/*" />
            <span class="hint">Jika fail dipilih, gambar akan dimuat naik automatik ke Supabase Storage dan mengatasi Link Gambar di atas.</span>
          </div>
          <div class="full">
            <button type="submit" id="submitItemBtn" class="btn-primary">+ Tambah Item Baharu</button>
          </div>
        </form>
        <input id="editImageFileInput" type="file" accept="image/*" style="display:none;" />
      </div>
    </div>

    <div class="filter-bar">
      <button type="button" class="filter-btn active" data-cat="ALL" onclick="setCategoryFilter('ALL')">Semua</button>
      <button type="button" class="filter-btn" data-cat="Pre-Order" onclick="setCategoryFilter('Pre-Order')">Pre-Order</button>
      <button type="button" class="filter-btn" data-cat="Ready Stock" onclick="setCategoryFilter('Ready Stock')">Ready Stock</button>
    </div>

    <div id="listContainer">
      <div class="card"><p class="sub" style="margin:0;">Sedang memuatkan data...</p></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://bqcyaqqmfgbnyhhsjjwi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Vay2hyDEviMK6BkHoRmcHQ_D6ipokFc';
    const STORAGE_BUCKET = 'product-images';
    const ADMIN_PIN = 'Adhwa95#1995';
    const WHATSAPP_NUMBER = '60129456492';

    const ADMIN_SESSION_KEY = 'pa_optcg_admin_unlocked';
    let isAdmin = sessionStorage.getItem(ADMIN_SESSION_KEY) === 'true';
    let activeCategory = 'ALL';
    let items = [];
    let supabaseClient = null;
    let pendingEditImageIdx = null;

    const listContainer = document.getElementById('listContainer');
    const roleBadge = document.getElementById('roleBadge');
    const roleDesc = document.getElementById('roleDesc');
    const adminBtn = document.getElementById('adminBtn');
    const adminFormWrap = document.getElementById('adminFormWrap');
    const submitItemBtn = document.getElementById('submitItemBtn');
    const editImageFileInput = document.getElementById('editImageFileInput');

    function initSupabase() {
      if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('TAMPAL_KUNCI')) {
        listContainer.innerHTML = '<div class="card"><div class="msg-error">Sila tampal kunci SUPABASE_ANON_KEY anda dalam fail index.html.</div></div>';
        return false;
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return true;
    }

    async function uploadImageToStorage(file) {
      if (!file || !supabaseClient) return '';
      const rawExt = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const ext = rawExt || 'jpg';
      const filePath = `items/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

      const { error: uploadError } = await supabaseClient.storage
        .from(STORAGE_BUCKET)
        .upload(filePath, file, {
          contentType: file.type || `image/${ext}`,
          upsert: false
        });

      if (uploadError) {
        throw new Error('Gagal upload gambar ke Storage: ' + uploadError.message);
      }

      const { data: publicData } = supabaseClient.storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(filePath);

      return publicData?.publicUrl || '';
    }

    function updateAdminUI() {
      if (isAdmin) {
        roleBadge.textContent = 'Mod Admin Aktif';
        roleBadge.className = 'status-pill admin';
        roleDesc.textContent = 'Anda boleh tambah item Pre-Order / Ready Stock, upload atau tukar gambar, rekod pembeli, dan ubah slot.';
        adminBtn.textContent = 'Keluar Admin';
        adminBtn.className = 'btn-logout';
        adminFormWrap.style.display = 'block';
      } else {
        roleBadge.textContent = 'Mod Lihat Sahaja';
        roleBadge.className = 'status-pill';
        roleDesc.textContent = 'Pilih kategori Pre-Order atau Ready Stock, semak gambar, harga, baki slot, dan terus order ke WhatsApp.';
        adminBtn.textContent = 'Mod Admin';
        adminBtn.className = 'btn-admin';
        adminFormWrap.style.display = 'none';
      }
      renderItems();
    }

    function setCategoryFilter(cat) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      renderItems();
    }

    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem(ADMIN_SESSION_KEY);
        updateAdminUI();
        return;
      }
      const pin = prompt('Masukkan PIN Admin:');
      if (pin === null) return;
      if (pin === ADMIN_PIN) {
        isAdmin = true;
        sessionStorage.setItem(ADMIN_SESSION_KEY, 'true');
        updateAdminUI();
      } else {
        alert('PIN salah.');
      }
    }

    async function loadItems() {
      if (!supabaseClient && !initSupabase()) return;
      const { data, error } = await supabaseClient
        .from('preorder_items')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        listContainer.innerHTML = `<div class="card"><div class="msg-error">Gagal memuatkan data dari Supabase: ${escapeHtml(error.message)}</div></div>`;
        return;
      }
      items = Array.isArray(data) ? data : [];
      renderItems();
    }

    function getBoughtQty(item) {
      return (item.buyers || []).reduce((sum, b) => sum + (Number(b.qty) || 0), 0);
    }

    function formatPrice(val) {
      const num = Number(val);
      if (isNaN(num) || num <= 0) return 'Harga Belum Ditetapkan';
      return 'RM ' + num.toFixed(2);
    }

    function normalizeCategory(cat) {
      return cat === 'Ready Stock' ? 'Ready Stock' : 'Pre-Order';
    }

    function isRecentItem(createdAt) {
      if (!createdAt) return false;
      const ageMs = Date.now() - new Date(createdAt).getTime();
      return ageMs >= 0 && ageMs <= 3 * 24 * 60 * 60 * 1000;
    }

    function getWhatsAppOrderUrl(item, available) {
      const cleanPhone = WHATSAPP_NUMBER.replace(/\D/g, '');
      const cat = normalizeCategory(item.category);
      const priceText = formatPrice(item.price);
      const noteLine = item.note ? `\n• Catatan: ${item.note}` : '';
      const message =
        `Hi, saya berminat nak order item (${cat}) ini:\n` +
        `• Kategori: ${cat}\n` +
        `• Item: ${item.name}\n` +
        `• Harga: ${priceText}\n` +
        `• Baki slot/stok available: ${available} pcs` +
        noteLine;
      return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
    }

    function copyPromoText(itemId) {
      const item = items.find(x => x.id === itemId);
      if (!item) return;
      const cat = normalizeCategory(item.category);
      const bought = getBoughtQty(item);
      const total = Math.max(1, Number(item.total) || 1);
      const available = Math.max(0, total - bought);
      const text =
        `${cat.toUpperCase()} OPEN!\n` +
        `• Kategori: ${cat}\n` +
        `• Item: ${item.name}\n` +
        `• Harga: ${formatPrice(item.price)}\n` +
        `• Available: ${available} / ${total} pcs` +
        (item.note ? `\n• Catatan: ${item.note}` : '') +
        `\n• Semak & order di: ${window.location.href}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('Teks pengumuman disalin!'));
      } else {
        prompt('Salin teks pengumuman di bawah:', text);
      }
    }

    function renderItems() {
      const filtered = activeCategory === 'ALL'
        ? items
        : items.filter(it => normalizeCategory(it.category) === activeCategory);

      if (!filtered.length) {
        listContainer.innerHTML = `<div class="card"><p class="sub" style="margin:0;">Tiada item dalam kategori "${escapeHtml(activeCategory)}" buat masa ini.</p></div>`;
        return;
      }

      listContainer.innerHTML = `<div class="grid-list">` + filtered.map((item) => {
        const itemIdx = items.findIndex(x => x.id === item.id);
        const cat = normalizeCategory(item.category);
        const bought = getBoughtQty(item);
        const total = Math.max(1, Number(item.total) || 1);
        const available = Math.max(0, total - bought);
        const isSoldOut = available === 0;
        const showNewBadge = isRecentItem(item.created_at);

        const imgSrc = (item.image_url || '').trim();
        const imgHtml = imgSrc
          ? `<img src="${escapeAttr(imgSrc)}" alt="${escapeAttr(item.name)}" class="product-img" />`
          : `<div class="img-placeholder">Tiada Gambar</div>`;

        const orderBtnHtml = isSoldOut
          ? `<span class="btn-order disabled">SOLD OUT</span>`
          : `<a href="${escapeAttr(getWhatsAppOrderUrl(item, available))}" target="_blank" rel="noopener noreferrer" class="btn-order">Order Now</a>`;

        const buyers = Array.isArray(item.buyers) ? item.buyers : [];
        const buyersHtml = buyers.length
          ? `<ol class="buyer-list">` + buyers.map((b, bIdx) => `
              <li>
                <span><strong>${escapeHtml(b.name)}</strong> (${Number(b.qty)})</span>
                ${isAdmin ? `<button type="button" class="btn-mini-del" onclick="removeBuyer(${itemIdx}, ${bIdx})">x</button>` : ''}
              </li>
            `).join('') + `</ol>`
          : `<div class="item-note" style="margin:0;">Belum ada pembeli.</div>`;

        const buyerFormHtml = isAdmin ? `
          <form class="buyer-form" onsubmit="addBuyer(event, ${itemIdx})">
            <input type="text" id="buyerName-${itemIdx}" placeholder="Nama pembeli" required />
            <input type="number" id="buyerQty-${itemIdx}" min="1" value="1" required />
            <button type="submit" class="btn-slot">+</button>
          </form>
        ` : '';

        const adminActionsHtml = isAdmin ? `
          <div class="actions">
            <button type="button" class="btn-slot" onclick="toggleCategory(${itemIdx})">Tukar Kat.</button>
            <button type="button" class="btn-copy" onclick="copyPromoText('${escapeAttr(item.id)}')">Copy</button>
            <button type="button" class="btn-slot" onclick="editPrice(${itemIdx})">Harga</button>
            <button type="button" class="btn-slot" onclick="uploadImageForItem(${itemIdx})">Upload Gbr</button>
            <button type="button" class="btn-slot" onclick="editImageUrl(${itemIdx})">Link Gbr</button>
            <button type="button" class="btn-slot" onclick="changeTotal(${itemIdx}, 1)">+1</button>
            <button type="button" class="btn-slot" onclick="changeTotal(${itemIdx}, -1)">-1</button>
            <button type="button" class="btn-del" onclick="deleteItem(${itemIdx})">Padam</button>
          </div>
        ` : '';

        return `
          <div class="item-card ${isSoldOut ? 'sold-out' : ''}">
            <div>
              ${imgHtml}
              <div class="badge-row">
                <span class="cat-badge ${cat === 'Ready Stock' ? 'ready' : ''}">${escapeHtml(cat)}</span>
                ${showNewBadge ? `<span class="badge-new">NEW</span>` : ''}
                <span class="badge">${isSoldOut ? 'SOLD OUT' : available + ' AVAIL'}</span>
              </div>
              <div class="item-title">${escapeHtml(item.name)}</div>
              <div class="item-price">${escapeHtml(formatPrice(item.price))}</div>
              ${item.note ? `<div class="item-note">${escapeHtml(item.note)}</div>` : ''}

              <div class="stats">
                <div>
                  <div class="stat-num">${total}</div>
                  <div class="stat-label">Slot</div>
                </div>
                <div>
                  <div class="stat-num">${bought}</div>
                  <div class="stat-label">Beli</div>
                </div>
                <div>
                  <div class="stat-num">${available}</div>
                  <div class="stat-label">Baki</div>
                </div>
              </div>
            </div>

            <div>
              ${orderBtnHtml}

              <div class="buyers-box">
                <div class="buyers-title">Pembeli (${buyers.length})</div>
                ${buyersHtml}
                ${buyerFormHtml}
              </div>

              ${adminActionsHtml}
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    }

    function uploadImageForItem(itemIdx) {
      if (!isAdmin || !supabaseClient) return;
      pendingEditImageIdx = itemIdx;
      editImageFileInput.value = '';
      editImageFileInput.click();
    }

    editImageFileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      const itemIdx = pendingEditImageIdx;
      pendingEditImageIdx = null;
      if (!file || itemIdx === null || !isAdmin || !supabaseClient) return;

      const item = items[itemIdx];
      try {
        const publicUrl = await uploadImageToStorage(file);
        const { data, error } = await supabaseClient
          .from('preorder_items')
          .update({ image_url: publicUrl })
          .eq('id', item.id)
          .select()
          .single();

        if (error) {
          alert('Gagal simpan link gambar ke database: ' + error.message);
          return;
        }
        items[itemIdx] = data;
        renderItems();
        alert('Gambar berjaya di-upload!');
      } catch (err) {
        alert(err.message);
      }
    });

    async function editImageUrl(itemIdx) {
      if (!isAdmin || !supabaseClient) return;
      const item = items[itemIdx];
      const input = prompt(`Masukkan link URL gambar untuk "${item.name}" (atau kosongkan untuk buang):`, item.image_url || '');
      if (input === null) return;
      const cleanUrl = input.trim();

      const { data, error } = await supabaseClient
        .from('preorder_items')
        .update({ image_url: cleanUrl })
        .eq('id', item.id)
        .select()
        .single();

      if (error) {
        alert('Gagal kemas kini gambar: ' + error.message);
        return;
      }
      items[itemIdx] = data;
      renderItems();
    }

    async function toggleCategory(itemIdx) {
      if (!isAdmin || !supabaseClient) return;
      const item = items[itemIdx];
      const nextCat = normalizeCategory(item.category) === 'Pre-Order' ? 'Ready Stock' : 'Pre-Order';

      const { data, error } = await supabaseClient
        .from('preorder_items')
        .update({ category: nextCat })
        .eq('id', item.id)
        .select()
        .single();

      if (error) {
        alert('Gagal tukar kategori: ' + error.message);
        return;
      }
      items[itemIdx] = data;
      renderItems();
    }

    async function editPrice(itemIdx) {
      if (!isAdmin || !supabaseClient) return;
      const item = items[itemIdx];
      const input = prompt(`Masukkan harga baharu (RM) untuk "${item.name}":`, item.price || 0);
      if (input === null) return;
      const num = parseFloat(input);
      if (isNaN(num) || num < 0) {
        alert('Harga tidak sah.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('preorder_items')
        .update({ price: num })
        .eq('id', item.id)
        .select()
        .single();

      if (error) {
        alert('Gagal kemas kini harga: ' + error.message);
        return;
      }
      items[itemIdx] = data;
      renderItems();
    }

    async function addBuyer(e, itemIdx) {
      e.preventDefault();
      if (!isAdmin || !supabaseClient) return;
      const item = items[itemIdx];
      const nameInput = document.getElementById(`buyerName-${itemIdx}`);
      const qtyInput = document.getElementById(`buyerQty-${itemIdx}`);
      const name = nameInput.value.trim();
      const qty = parseInt(qtyInput.value, 10);
      if (!name || isNaN(qty) || qty < 1) return;

      const updatedBuyers = [...(item.buyers || []), { name, qty }];
      const { data, error } = await supabaseClient
        .from('preorder_items')
        .update({ buyers: updatedBuyers })
        .eq('id', item.id)
        .select()
        .single();

      if (error) {
        alert('Gagal simpan pembeli: ' + error.message);
        return;
      }
      items[itemIdx] = data;
      renderItems();
    }

    async function removeBuyer(itemIdx, buyerIdx) {
      if (!isAdmin || !supabaseClient) return;
      const item = items[itemIdx];
      const updatedBuyers = (item.buyers || []).filter((_, idx) => idx !== buyerIdx);
      const { data, error } = await supabaseClient
        .from('preorder_items')
        .update({ buyers: updatedBuyers })
        .eq('id', item.id)
        .select()
        .single();

      if (error) {
        alert('Gagal buang pembeli: ' + error.message);
        return;
      }
      items[itemIdx] = data;
      renderItems();
    }

    async function changeTotal(itemIdx, delta) {
      if (!isAdmin || !supabaseClient) return;
      const item = items[itemIdx];
      const bought = getBoughtQty(item);
      const nextTotal = Number(item.total) + delta;
      if (nextTotal < Math.max(1, bought)) return;

      const { data, error } = await supabaseClient
        .from('preorder_items')
        .update({ total: nextTotal })
        .eq('id', item.id)
        .select()
        .single();

      if (error) {
        alert('Gagal ubah slot: ' + error.message);
        return;
      }
      items[itemIdx] = data;
      renderItems();
    }

    async function deleteItem(itemIdx) {
      if (!isAdmin || !supabaseClient) return;
      const item = items[itemIdx];
      if (!confirm(`Padam item "${item.name}"?`)) return;

      const { error } = await supabaseClient
        .from('preorder_items')
        .delete()
        .eq('id', item.id);

      if (error) {
        alert('Gagal padam item: ' + error.message);
        return;
      }
      items.splice(itemIdx, 1);
      renderItems();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/`/g, '&#96;');
    }

    document.getElementById('preorderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!isAdmin || !supabaseClient) return;

      const category = normalizeCategory(document.getElementById('itemCategory').value);
      const name = document.getElementById('itemName').value.trim();
      const total = parseInt(document.getElementById('totalSlot').value, 10);
      const price = parseFloat(document.getElementById('itemPrice').value);
      const note = document.getElementById('slotNote').value.trim();
      const typedUrl = document.getElementById('itemImage').value.trim();
      const fileInput = document.getElementById('itemImageFile');
      const selectedFile = fileInput.files && fileInput.files[0];

      if (!name || isNaN(total) || total < 1) return;

      submitItemBtn.disabled = true;
      submitItemBtn.textContent = 'Sedang menyimpan...';

      try {
        let finalImageUrl = typedUrl;
        if (selectedFile) {
          finalImageUrl = await uploadImageToStorage(selectedFile);
        }

        const newItem = {
          id: 'item-' + Date.now(),
          category,
          name,
          total,
          price: isNaN(price) || price < 0 ? 0 : price,
          note,
          image_url: finalImageUrl,
          buyers: []
        };

        const { data, error } = await supabaseClient
          .from('preorder_items')
          .insert([newItem])
          .select()
          .single();

        if (error) {
          alert('Gagal tambah item: ' + error.message);
          return;
        }
        items.unshift(data);
        e.target.reset();
        renderItems();
      } catch (err) {
        alert(err.message);
      } finally {
        submitItemBtn.disabled = false;
        submitItemBtn.textContent = '+ Tambah Item Baharu';
      }
    });

    updateAdminUI();
    loadItems();

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
